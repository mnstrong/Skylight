<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screensaver</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400&family=Nunito+Sans:wght@200;300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: 'Nunito', sans-serif;
  }

  /* Each slide is a full-screen container */
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 2s ease-in-out;
  }
  .slide.active { opacity: 1; }

  /* img fills the slide, object-fit covers like background-size: cover */
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* Dark gradient overlay so text is always readable */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.08) 0%,
      rgba(0,0,0,0.0) 30%,
      rgba(0,0,0,0.25) 70%,
      rgba(0,0,0,0.55) 100%
    );
    z-index: 1;
  }

  /* Clock container — bottom-left, Skylight style */
  .clock-wrap {
    position: absolute;
    bottom: 7vh;
    left: 7vw;
    z-index: 2;
    color: #fff;
    text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  }

  .time {
    font-family: 'Nunito', sans-serif;
    font-weight: 200;
    font-size: 160px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #ffffff;
  }

  .time .ampm {
    font-size: 0.32em;
    font-weight: 300;
    letter-spacing: 0.08em;
    vertical-align: super;
    margin-left: 0.15em;
    opacity: 0.85;
    text-transform: uppercase;
  }

  .date {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 300;
    font-size: 36px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.82;
    margin-top: 0.3em;
    color: #f0f0f0;
  }

  .separator {
    width: 48px;
    height: 2px;
    background: rgba(255,255,255,0.6);
    margin: 0.5em 0;
    border-radius: 2px;
  }
</style>
</head>
<body>

<!-- Slides using <img> tags instead of CSS background-image -->
<div class="slide active" id="slide0"><img src="https://mnstrong.github.io/Skylight/bg/bg1.jpg" alt=""></div>
<div class="slide" id="slide1"><img src="https://mnstrong.github.io/Skylight/bg/bg2.jpg" alt=""></div>
<div class="slide" id="slide2"><img src="https://mnstrong.github.io/Skylight/bg/bg3.jpg" alt=""></div>
<div class="slide" id="slide3"><img src="https://mnstrong.github.io/Skylight/bg/bg4.jpg" alt=""></div>
<div class="slide" id="slide4"><img src="https://mnstrong.github.io/Skylight/bg/bg5.jpg" alt=""></div>
<div class="slide" id="slide5"><img src="https://mnstrong.github.io/Skylight/bg/bg6.jpg" alt=""></div>
<div class="slide" id="slide6"><img src="https://mnstrong.github.io/Skylight/bg/bg7.jpg" alt=""></div>

<div class="overlay"></div>

<div class="clock-wrap">
  <div class="time" id="time">12:00<span class="ampm">AM</span></div>
  <div class="separator"></div>
  <div class="date" id="date">Monday, January 1</div>
</div>

<script>
  const slides = Array.from(document.querySelectorAll('.slide'));
  let current = 0;

  function rotate() {
    const next = (current + 1) % slides.length;
    slides[next].classList.add('active');
    setTimeout(() => slides[current].classList.remove('active'), 2000);
    current = next;
    setTimeout(rotate, 300000);
  }

  setTimeout(rotate, 300000);

  // ── Clock ────────────────────────────────────────────────────────────────────
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  function tick() {
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;

    document.getElementById('time').innerHTML =
      `${h}:${String(m).padStart(2,'0')}<span class="ampm">${ampm}</span>`;

    document.getElementById('date').textContent =
      `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
